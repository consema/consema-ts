# Consema TypeScript CI (https://github.com/consema/consema/blob/main/docs/five-language-ci-design.md §1.2, §7.1): the
# TypeScript implementation joins the release gate with ten explicit jobs
# (the design rejects a single shared matrix, §5.2). ts-gates runs the
# strict tsc check, the full node --test suite and the zero-runtime-
# dependency policy; coverage measures the src/ modules with node's
# built-in test coverage (60% line threshold); ts-compiler-matrix re-runs
# `tsc --noEmit` under the 5.8/5.9 compiler line (zod mode) so newer-only
# compiler usage fails CI; ts-conformance runs the TS runner over the 18
# shared suites / 519 cases (the aggregate digest cfd6e296…, the 18/519
# inventory and the per-suite counts are pinned in the runner,
# typescript/src/conformance/runner.ts, §2.2/§4.2 — runner.test.ts asserts
# them); ts-package runs the L5 packaging gate (npm pack — the tarball must
# contain the published dist/ entry points and the LICENSE text, and zero
# test-only files, §1.1 package row / §5.3 L5 row; G33/G35, 2026-08-14);
# npm-audit runs the
# standing dependency audit (npm audit against the npm registry advisory
# DB; the package declares zero runtime dependencies, so the
# devDependencies are the entire dependency surface, §1.3 — the daily-cron
# track lives in audit.yml); ts-differential runs the bidirectional
# scripts/ts-verify-*.ps1 harnesses against the Rust
# emitters (byte parity + normalized + protocol exchange); the verify
# scripts are Windows PowerShell 5.1 compatible and pass native Windows
# paths to node, so the differential job runs on windows-latest; the
# check-version-consistency, examples, ts-package and npm-audit jobs need
# no conformance data and use a single checkout. A shared-conformance
# script (scripts/ts-verify-shared-conformance.ps1, §3.6/§7.2) is planned
# as a fourth differential step but is NOT landed yet; the TS runner CLI
# (main() in typescript/src/conformance/runner.ts) is wired into the
# ts-conformance job as a CLI smoke step (G158, 2026-08-13 — no CI job
# was executing the shipped CLI before). No repository secrets are
# required.
#
# This repository carries the TypeScript implementation only, so four jobs
# use the multi-repo checkout mode (ts-gates, coverage, ts-conformance,
# ts-differential): they check out consema/consema (the spec repository,
# whose conformance/vectors + conformance/differential case sets and the
# toml.corpus.cargo-manifest fixture conformance/fixtures/toml/Cargo.toml
# are the single authority; the conformance checkout is pinned to the
# commit carrying the cfd6e296 519-case inventory, 096e5f8) beside this
# repository and copies the conformance data into the workspace root (the
# runner and the differential harnesses resolve conformance/* by
# repository-relative path). The differential job additionally checks out
# consema/consema-rs (the Rust emitter workspace; the ts-verify-*.ps1
# scripts default to <repo root>\consema-rs) and the scripts build the
# pinned emitter examples (cargo build --locked -p consema-conformance
# --example …) there. The other six jobs (ts-compiler-matrix, npm-audit,
# check-version-consistency, examples, ts-package, check) use a single
# checkout.
name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + multi-repo checkouts + running repo scripts); none
# uploads artifacts or writes check runs, so the global minimum suffices
# (cache restore works with contents: read; cache save denial is a warning
# only, per the actions/cache contract).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ts-gates:
    name: ts gates (type + unit tests + zero-dep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore. The fc-manifest digest record
          # is not copied: nothing in this repository consumes the copied
          # manifest (the digest is pinned in runner.ts / runner.test.ts).
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check
      # The full node --test suite via the glob form (node 26 resolves --test
      # positional arguments as glob patterns). The inline glob is equivalent
      # to the package.json test script (`node --test "src/**/*.test.ts"`),
      # so this runs the identical suite as `npm test` (unit tests +
      # conformance + capability parity; differential tests report documented
      # skips without their golden env vars). node --test exits 0 even when
      # the glob matches nothing ("tests 0"), so the zero-match guard below
      # asserts a real lower bound before running.
      - name: node --test (full suite, src/**/*.test.ts)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          files="$(find src -name '*.test.ts' | wc -l)"
          if [[ "$files" -lt 1 ]]; then
            echo "::error::no *.test.ts files matched — the --test glob would run zero tests and exit 0"
            exit 1
          fi
          echo "running $files test files"
          node --test "src/**/*.test.ts"
      # Zero-runtime-dependency policy (§1.3): package.json declares only
      # devDependencies, so `npm ls --omit=dev` must show an empty tree.
      - name: zero-dependency assertion (npm ls --omit=dev must be empty)
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = npm ls --omit=dev --json 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "npm ls --omit=dev failed (exit $LASTEXITCODE)"
          }
          $tree = $out | ConvertFrom-Json
          $deps = $tree.dependencies
          if ($null -ne $deps -and @($deps.PSObject.Properties).Count -gt 0) {
            throw "runtime dependencies found: $($deps.PSObject.Properties.Name -join ', ')"
          }
          Write-Output 'zero runtime dependencies: npm ls --omit=dev shows none'
      # The src import surface must not reference devDependencies (G96,
      # 2026-08-14): npm ls only proves the install tree is empty — a src
      # module importing 'typescript' or '@types/node' would install clean
      # and fail only in the consumer's package. Every src import must be a
      # relative path or a node: builtin.
      - name: src import surface must be relative or node builtins
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          bad="$(grep -rP --include='*.ts' -Hno "(?:from|import\()\s+['\"](?!\./|\.\./|node:)[^'\"]+" src || true)"
          if [ -n "$bad" ]; then
            echo "::error::src imports a bare specifier (devDependency leak into the consumer import surface):"
            echo "$bad"
            exit 1
          fi
          echo "src import surface: only relative and node: specifiers"

  # Coverage gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): node 26's built-in test coverage
  # (--experimental-test-coverage) measures the files loaded by the suite;
  # node_modules and the matching test files are excluded from the report by
  # default, so the percentage reflects the src/ modules the tests exercise.
  # --test-coverage-lines=60 fails the run (exit 1) when line coverage drops
  # below 60% — the threshold assertion is built into the test runner
  # (initial threshold, tightened as coverage improves). The conformance
  # tests need the provisioned conformance data, so the multi-repo checkout
  # + provision steps of ts-gates are replicated.
  coverage:
    name: coverage (node built-in coverage, lines >= 60%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore. The fc-manifest digest record
          # is not copied: nothing in this repository consumes the copied
          # manifest (the digest is pinned in runner.ts / runner.test.ts).
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # Glob form (node 26 resolves --test arguments as glob patterns) with
      # the coverage switch and the 60% line threshold: the run fails (exit
      # 1) when line coverage of the loaded src/ modules drops below 60%.
      # node --test exits 0 even when the glob matches nothing, so the
      # zero-match guard below asserts a real lower bound before running
      # (same guard as the ts-gates job; G36, 2026-08-14).
      - name: node --test with built-in coverage (lines >= 60%)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          files="$(find src -name '*.test.ts' | wc -l)"
          if [[ "$files" -lt 1 ]]; then
            echo "::error::no *.test.ts files matched — the --test glob would run zero tests and exit 0"
            exit 1
          fi
          echo "running $files test files"
          node --test --experimental-test-coverage --test-coverage-lines=60 "src/**/*.test.ts"

  # TS compiler matrix (zod mode): the repo pins typescript ~5.9.0
  # (package.json devDependencies); this job reinstalls the compiler at each
  # matrix version after `npm ci` and re-runs the strict `tsc --noEmit`
  # check, so accidentally relying on newer-only compiler syntax/API fails
  # CI even when the lockfile is untouched. The matrix pins exact versions
  # (a floating 5.8.x/5.9.x range would resolve a different patch on each
  # run and detach the "verified" claim from what actually ran). Versions
  # verified locally (2026-08-12): 5.8.3 and 5.9.2 both compile the tree
  # clean with @types/node 26.2.0. The install rewrites the committed
  # package-lock.json and the package.json devDependencies entry
  # (typescript) — ephemeral drift only, the legs never commit, and the
  # check runs against the installed compiler.
  ts-compiler-matrix:
    name: tsc --noEmit (typescript ${{ matrix.ts }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ts: ['5.8.3', '5.9.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm install -D typescript@${{ matrix.ts }} (compiler matrix leg)
        working-directory: typescript
        run: npm install -D "typescript@${{ matrix.ts }}"
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check

  ts-conformance:
    name: ts conformance runner (18 suites / 519 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore. The fc-manifest digest record
          # is not copied: nothing in this repository consumes the copied
          # manifest (the digest is pinned in runner.ts / runner.test.ts).
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # The runner (typescript/src/conformance/runner.ts) verifies the
      # aggregate digest
      # cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a
      # (fc-manifest-0.13.0.json — 键 aggregate_sha256 / note), the 18 suites
      # / 519 cases inventory, the per-suite counts, and executes every case
      # (zero failures, documented skips only) — the §4.2 hard pins live in
      # the runner; runner.test.ts asserts them. Glob form: node 26 resolves
      # --test arguments as glob patterns, not directories; the zero-match
      # guard below asserts a real lower bound (G36, 2026-08-14).
      - name: run the conformance runner (node --test glob)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          files="$(find src/conformance -name '*.test.ts' | wc -l)"
          if [[ "$files" -lt 1 ]]; then
            echo "::error::no *.test.ts files matched — the --test glob would run zero tests and exit 0"
            exit 1
          fi
          echo "running $files test files"
          node --test "src/conformance/**/*.test.ts"
      # Runner CLI smoke test (node src/conformance/runner.ts): the CLI
      # entry (main(), typescript/src/conformance/runner.ts) must actually
      # run in CI — 18 suites / 519 cases, exit 0 (RFC 0015 §5.1 success
      # class; verified locally 2026-08-13: 519 passed, digest match). The
      # output assertion makes the smoke real: without it, a broken entry
      # detection exits 0 while main() never runs (G37, 2026-08-14).
      - name: runner CLI smoke (node src/conformance/runner.ts, exit 0)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          out="$(node src/conformance/runner.ts)"
          echo "$out"
          echo "$out" | grep -q "total: 519 passed, 0 skipped, 0 failed" || {
            echo "::error::the runner CLI did not report '519 passed, 0 skipped' — entry detection may have silently skipped main()"
            exit 1
          }

  ts-differential:
    name: ts differential vs Rust (byte parity + normalized + protocol exchange)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema-rs
          ref: bd5734eab969fa7c8a1a1564d4ee50b85f3d10d6 # cfd6e296 519-case vendored conformance + emitter pin
          path: consema-rs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: 096e5f840ecc714912db779706fd881405b92308 # cfd6e296 519-case conformance data pin
          path: consema-repo
      # G70 (adversarial audit, 2026-08-14): the Rust emitter toolchain is
      # pinned to 1.97.1 — the version this harness was locally verified
      # with (钉定本机实测版本), so the differential goldens are
      # bit-reproducible (位级可复现) and independent of the runner's
      # current stable.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.97.1
        with:
          toolchain: 1.97.1
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: consema-rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore. The fc-manifest digest record
          # is not copied: nothing in this repository consumes the copied
          # manifest (the digest is pinned in runner.ts / runner.test.ts).
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"
      # Each script builds the pinned Rust emitter inside the consema-rs
      # checkout (cargo build --locked -p consema-conformance --example …;
      # the scripts default to <repo root>\consema-rs), provisions the
      # golden/evidence directories, runs the TS side with the golden env
      # vars set, closes the reverse direction, and asserts the tests RAN
      # (not skipped).
      - name: scripts/ts-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/ts-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/ts-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Dependency audit (npm audit), the standing security gate in the
  # aggregate check (rs ci.yml shape; G135, 2026-08-13). Identical to the
  # audit.yml npm-audit job — the daily cron lives in the separate audit.yml
  # workflow because the aggregate check's needs must name jobs within the
  # same workflow (G99, 2026-08-14). The package declares ZERO runtime
  # dependencies
  # (package.json has only devDependencies — @types/node, typescript — per
  # the §1.3 zero-runtime-dependency policy, asserted in ts-gates), so `npm
  # audit` in full (no --omit=dev) covers the complete dependency surface:
  # the devDependencies and their transitive tree are the whole graph. The
  # job is unconditional (no `if:`) so it can never be skipped — a skipped
  # job in the aggregate would fail the alls-green gate (unconditional jobs
  # need no skip allowance).
  npm-audit:
    name: npm audit (npm advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm audit (full — devDependencies are the entire dependency surface)
        working-directory: typescript
        run: npm audit

  # Version-consistency gate (tokio check-readme pattern): the README
  # "Version:" line must equal the typescript/package.json version, so a
  # version bump that forgets the README fails CI.
  check-version-consistency:
    name: check README version vs package.json (version consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: assert package.json version == README Version line
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' typescript/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in typescript/package.json"
            exit 1
          fi
          # Exact comparison of the version token, not a substring match:
          # "1.0.0" is a substring of "1.0.0-rc.1（…）", so a rc-to-GA bump
          # that forgets the README must not pass. The README line is
          # "Version: <version>（…）", so the token is everything up to the
          # full-width parenthesis.
          readme_version=$(grep -m1 '^Version: ' README.md | sed -E 's/^Version: ([^（]+).*/\1/')
          if [[ "$readme_version" != "$version" ]]; then
            echo "::error::README.md Version line ($readme_version) != package.json version ($version)"
            exit 1
          fi
          # The bug_report.yml template hard-codes the current version; an
          # rc-to-GA bump that forgets the template must fail CI too.
          grep -qF "version（当前 $version）" .github/ISSUE_TEMPLATE/bug_report.yml || {
            echo "::error::.github/ISSUE_TEMPLATE/bug_report.yml does not declare the current version"
            exit 1
          }
          echo "README version consistent with package.json: $version"

  # SDK examples gate: typescript/examples/sdk_chain.ts is the committed
  # five-language SDK chain example (parse -> native query -> best-exact
  # projection -> semantic edit -> canonical materialization -> TOML
  # conversion; language-neutral contract reference: consema repository
  # https://github.com/consema/consema/blob/main/docs/cookbook.md). node 26 runs .ts files natively, and the example must
  # exit 0. The example is a pure SDK chain (no conformance data), so no
  # multi-repo checkout or provision step is needed.
  examples:
    name: examples (node examples/sdk_chain.ts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: node examples/sdk_chain.ts (must exit 0)
        working-directory: typescript
        run: node examples/sdk_chain.ts

  # L5 packaging gate (five-language-ci-design.md §1.1 package row / §5.3
  # L5 row): `npm pack` must succeed (prepack builds dist/) and the tarball
  # must contain the published dist/ entry points, the LICENSE text, and
  # zero test-only files; then a clean-directory install must import the
  # package root (G33/G35/G95, 2026-08-14). Nothing is published here, no
  # repository secrets are used, and no conformance data is needed
  # (packaging is data-independent).
  ts-package:
    name: "ts package (npm pack, files: dist + LICENSE)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm pack + tarball shape assertion (dist, LICENSE, zero test-only)
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errFile = Join-Path $env:RUNNER_TEMP 'npm-pack-stderr.txt'
          $out = & npm pack --json 2>$errFile
          if ($LASTEXITCODE -ne 0) {
            $err = if (Test-Path -LiteralPath $errFile) { Get-Content -LiteralPath $errFile -Raw } else { '' }
            throw "npm pack failed (exit $LASTEXITCODE):`n$err"
          }
          Remove-Item -LiteralPath $errFile -ErrorAction SilentlyContinue
          $pack = @($out | ConvertFrom-Json)[0]
          $files = @($pack.files | ForEach-Object { $_.path })
          if (-not ($files -contains 'dist/index.js') -or -not ($files -contains 'dist/index.d.ts')) {
            throw 'npm pack tarball must contain dist/index.js + dist/index.d.ts (the published entry points, G33)'
          }
          if (-not ($files -contains 'LICENSE')) {
            throw 'npm pack tarball must contain the LICENSE text (G95)'
          }
          $testOnly = @($files | Where-Object { $_ -match '(\.test\.|test_helpers|test_decode)' })
          if ($testOnly.Count -gt 0) {
            throw "npm pack tarball must not contain test-only files: $($testOnly -join ', ')"
          }
          Write-Output "npm pack ok: $($pack.files.Count) files, dist entry points + LICENSE present, zero test-only files"
      # Clean-directory install + package-root import smoke (G33,
      # 2026-08-14): the tarball must be importable from the package root by
      # a consumer — the source-direct shape failed this check under node 26
      # (type stripping refuses node_modules), this step keeps the dist
      # shape honest in CI.
      - name: clean-install package-root import smoke
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP ('consema-ts-install-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force (Join-Path $tmp 'app') | Out-Null
          $packed = npm pack --pack-destination $tmp --json
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $pkg = @($packed | ConvertFrom-Json)[0]
          $tgz = Join-Path $tmp $pkg.filename
          Push-Location (Join-Path $tmp 'app')
          try {
            npm init -y | Out-Null
            npm install $tgz | Out-Null
            node --input-type=module -e "import { parseDocument, profiles, formatFamilies } from '@consema/consema'; const pid = profiles().find(p => p.profile().id() === 'json.strict')?.profile(); if (!pid) throw new Error('no json.strict profile'); const d = parseDocument(new TextEncoder().encode('{\"a\":1}'), pid); if (typeof d.asJson() === 'string') throw new Error('not json'); if (formatFamilies().length !== 8) throw new Error('bad families'); console.log('package root import OK')"
            if ($LASTEXITCODE -ne 0) { throw 'package root import failed' }
          }
          finally {
            Pop-Location
            Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [ts-gates, ts-conformance, ts-differential, ts-compiler-matrix, coverage, npm-audit, check-version-consistency, examples, ts-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
