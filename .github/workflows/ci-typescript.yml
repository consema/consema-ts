# Consema TypeScript CI (https://github.com/consema/consema/blob/main/docs/five-language-ci-design.md §1.2, §7.1): the
# TypeScript implementation joins the release gate with ten explicit jobs
# (the design rejects a single shared matrix, §5.2). ts-gates runs the
# strict tsc check, the full node --test suite and the zero-runtime-
# dependency policy; coverage measures the src/ modules with node's
# built-in test coverage (60% line threshold); ts-compiler-matrix re-runs
# `tsc --noEmit` under the 5.8/5.9 compiler line (zod mode) so newer-only
# compiler usage fails CI; ts-conformance runs the TS runner over the 18
# shared suites / 519 cases (the aggregate digest cfd6e296… is the spec
# repo's recorded value: the runner computes the digest and compares it to
# the provisioned fc-manifest record — a documented skip when the manifest
# is not provisioned, W4-13/R10; the 18/519 inventory and the per-suite
# counts are pinned in the runner, typescript/src/conformance/runner.ts,
# §2.2/§4.2 — runner.test.ts asserts them);
# ts-package runs the L5 packaging gate (npm pack — the tarball must
# contain the published dist/ entry points and the LICENSE text, and zero
# test-only files, §1.1 package row / §5.3 L5 row; G33/G35, 2026-08-14);
# npm-audit runs the
# standing dependency audit (npm audit against the npm registry advisory
# DB; the package declares zero runtime dependencies, so the
# devDependencies are the entire dependency surface, §1.3 — the daily-cron
# track lives in audit.yml); ts-differential runs the bidirectional
# scripts/ts-verify-*.ps1 harnesses against the Rust
# emitters (byte parity + normalized + protocol exchange); the verify
# scripts are Windows PowerShell 5.1 compatible and pass native Windows
# paths to node, so the differential job runs on windows-latest; the
# check-version-consistency, examples, ts-package and npm-audit jobs need
# no conformance data and use a single checkout. A shared-conformance
# script (scripts/ts-verify-shared-conformance.ps1, §3.6/§7.2) is planned
# as a fourth differential step but is NOT landed yet; the TS runner CLI
# (main() in typescript/src/conformance/runner.ts) is wired into the
# ts-conformance job as a CLI smoke step (G158, 2026-08-13 — no CI job
# was executing the shipped CLI before). No repository secrets are
# required.
#
# This repository carries the TypeScript implementation only, so four jobs
# use the multi-repo checkout mode (ts-gates, coverage, ts-conformance,
# ts-differential): they check out consema/consema (the spec repository,
# whose conformance/vectors + conformance/differential case sets and the
# toml.corpus.cargo-manifest fixture conformance/fixtures/toml/Cargo.toml
# are the single authority; the conformance checkout is pinned to the
# commit carrying the cfd6e296 519-case inventory, ccc9943 — the
# 2026-08-15 wave-4 R5 unified provision pin, a deliberate snapshot of the
# mother repo at wave-4 close (F2 re-anchored it while ccc9943 was the
# HEAD; the mother-repo HEAD has since advanced to 4ede284 — the pin stays
# because it carries the provisioned cfd6e296 conformance inventory; after
# b8bf4cb's R40 field-anchor evidence rework, manifest digest
# 5cb4ab51…)) beside this
# repository and copies the conformance data into the workspace root (the
# runner and the differential harnesses resolve conformance/* by
# repository-relative path). The differential job additionally checks out
# consema/consema-rs (the Rust emitter workspace; the ts-verify-*.ps1
# scripts default to <repo root>\consema-rs) and the scripts build the
# pinned emitter examples (cargo build --locked -p consema-conformance
# --example …) there. The other six jobs (ts-compiler-matrix, npm-audit,
# check-version-consistency, examples, ts-package, check) use a single
# checkout.
name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + multi-repo checkouts + running repo scripts); none
# uploads artifacts or writes check runs, so the global minimum suffices
# (cache restore works with contents: read; cache save denial is a warning
# only, per the actions/cache contract).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ts-gates:
    name: ts gates (type + unit tests + zero-dep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: ccc99430a6e3003bc1b0830d81cbad245323f0a4 # wave-4 R5 unified provision pin (deliberate snapshot at wave-4 close; the mother-repo HEAD has since advanced to 4ede284 — the pin stays because it carries the provisioned cfd6e296 conformance inventory, fc-manifest sha256 5cb4ab51)
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore. The fc-manifest digest record
          # (docs/fc-manifest-0.13.0.json) is deliberately not copied into the
          # workspace, so no provision-time manifest sha256 assertion is added
          # here (contrast go/py/kt: they copy it and assert sha256 5cb4ab51
          # at the wave-4 R5 unified provision pin ccc9943); ts's
          # aggregate-digest / 18-519 inventory assertions are runtime
          # assertions in runner.ts / runner.test.ts against the provisioned
          # conformance data (W4-13/R10 — documented skip when the manifest
          # is not present).
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check
      # The full node --test suite via the glob form (node 26 resolves --test
      # positional arguments as glob patterns). The inline glob is equivalent
      # to the package.json test script (`node --test "src/**/*.test.ts"`),
      # so this runs the identical suite as `npm test` (unit tests +
      # conformance + capability parity; differential tests report documented
      # skips without their golden env vars). node --test exits 0 even when
      # the glob matches nothing ("tests 0" — measured 2026-08-15), so the
      # find count below only proves *.test.ts files exist on disk; the real
      # zero-match guard is the executed test count parsed from the run's
      # output after it (a glob drift would otherwise pass the find count
      # while node runs zero tests).
      - name: node --test (full suite, src/**/*.test.ts)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          files="$(find src -name '*.test.ts' | wc -l)"
          if [[ "$files" -lt 1 ]]; then
            echo "::error::no *.test.ts files matched — the --test glob would run zero tests and exit 0"
            exit 1
          fi
          echo "running $files test files"
          # W5-35 (2026-08-15): the old `|| exit 1` terminated before the
          # captured output was printed, so a failing test run left a red
          # job with zero diagnostics (which test failed, which assertion
          # message — all swallowed). Print the captured output on failure
          # too, then exit with the real code.
          out="$(node --test "src/**/*.test.ts")" && test_exit=0 || test_exit=$?
          if [ "$test_exit" -ne 0 ]; then
            echo "::error::node --test failed (exit $test_exit) — diagnostics above:"
            echo "$out"
            exit 1
          fi
          echo "$out"
          # Executed-count lower bound (G36, hardened 2026-08-15): the find
          # count above proves *.test.ts files exist on disk, NOT that the
          # --test glob matches them — a glob that matches nothing exits 0
          # with "tests 0" (measured), so the guard must read the actual
          # executed count from the spec-reporter summary (the LAST 'tests
          # N' occurrence; per-file lines like "(6 tests)" put the number
          # before the word, and the terminal summary block is last, so
          # tail -1 anchors like the 'skipped N' parse below).
          tests="$(grep -oE 'tests [0-9]+' <<<"$out" | tail -1 | awk '{print $2}')"
          if [ -z "$tests" ]; then
            echo "::error::cannot parse the node --test summary ('tests N' missing from the output)"
            exit 1
          fi
          if [ "$tests" -lt 1 ]; then
            echo "::error::node --test executed 0 tests although $files *.test.ts files exist on disk — the --test glob 'src/**/*.test.ts' matched nothing (glob drift must be fixed, not shipped green)"
            exit 1
          fi
          echo "node --test executed $tests tests across $files test files"
          # Skip upper bound (R47, 2026-08-15): the full suite's documented
          # skips are (a) the differential tests without their golden env
          # vars (5 tests in 3 files as of wave 4 — byte_parity /
          # normalized / exchange) and (b) the four capability-parity tests
          # when the fc-manifest is not provisioned (R10/W4-13: the
          # provision step deliberately does not copy the manifest — it
          # lives at docs/fc-manifest-0.13.0.json in the spec repo, outside
          # the provision source conformance/; see the provision-step note
          # above — so the parity tests are documented skips here, never
          # silent). Upper bound 9 = 5 + 4. A new
          # silent skip (env-dependent skipIf, fixture-missing branch) or an
          # expanded documented skip face must redden the gate, not pass
          # green: "documented skip = success" only holds inside the
          # documented inventory.
          # The summary line is the LAST 'skipped N' occurrence in the
          # output (the per-suite conformance lines report '0 skipped'
          # earlier; the terminal summary block reports the real count with
          # a non-ASCII info marker, so the parse anchors on the count).
          skipped="$(grep -oE 'skipped [0-9]+' <<<"$out" | tail -1 | awk '{print $2}')"
          if [ -z "$skipped" ]; then
            echo "::error::cannot parse the node --test skip summary ('skipped N' missing from the output)"
            exit 1
          fi
          if [ "$skipped" -gt 9 ]; then
            echo "::error::$skipped tests skipped (documented upper bound 9 = 5 differential without their golden env vars + 4 capability parity without the provisioned fc-manifest); a new silent skip must be reviewed, not shipped"
            exit 1
          fi
          # Lower bound (W5-21, 2026-08-15): the documented skip set is an
          # exact inventory (5 differential + 4 capability parity are
          # unconditional in this job's environment), so a count below 9
          # means a documented skip silently became a pass — e.g. a
          # capability-parity test losing both its t.skip and its assertion
          # body, or a differential test dropping its env guard. The upper
          # bound alone would stay green on that regression.
          if [ "$skipped" -lt 9 ]; then
            echo "::error::$skipped tests skipped (expected exactly 9 = 5 differential without their golden env vars + 4 capability parity without the provisioned fc-manifest); a documented skip that silently became a pass must be reviewed, not shipped"
            exit 1
          fi
          echo "full suite: $skipped documented skips (inventory 9 = 5 differential + 4 parity, exact)"
      # Zero-runtime-dependency policy (§1.3): package.json declares only
      # devDependencies, so `npm ls --omit=dev` must show an empty tree.
      - name: zero-dependency assertion (npm ls --omit=dev must be empty)
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = npm ls --omit=dev --json 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "npm ls --omit=dev failed (exit $LASTEXITCODE)"
          }
          $tree = $out | ConvertFrom-Json
          $deps = $tree.dependencies
          if ($null -ne $deps -and @($deps.PSObject.Properties).Count -gt 0) {
            throw "runtime dependencies found: $($deps.PSObject.Properties.Name -join ', ')"
          }
          Write-Output 'zero runtime dependencies: npm ls --omit=dev shows none'
      # The src import surface must not reference devDependencies (G96,
      # 2026-08-14): npm ls only proves the install tree is empty — a src
      # module importing 'typescript' or '@types/node' would install clean
      # and fail only in the consumer's package. Every src import must be a
      # relative path or a node: builtin.
      #
      # Regex coverage (R46, 2026-08-15; extended W5-20/42, 2026-08-15):
      # the original pattern only matched `from '…'` and `import('…')`
      # literal forms. The extended gate also covers (a) side-effect
      # imports (`import 'x'`), (b) dynamic imports with a bare specifier
      # (`import('typescript')`) and variable arguments (`import(name)` — a
      # runtime dynamic import of a non-literal cannot be verified
      # statically; the TS type-query form `import('../../rel.ts').Type` in
      # annotations is allowed — it always carries a literal relative
      # specifier), (c) require calls (`require('x')` / `import x =
      # require('y')` — the package is ESM with static imports; zero
      # require( in the tree), (d) relative specifiers resolving into
      # node_modules (`../node_modules/...` — npm ci installs the full
      # devDependency tree, so such an import would pass npm ls/tsc and
      # break only in the consumer), (e) the ESM smuggling forms
      # `createRequire(import.meta.url)('bare')` and
      # `import.meta.resolve('bare')` (a createRequire result stored in a
      # variable and called in a later statement is not statically linked
      # by a regex — that residual is beyond grep scope and documented
      # here, not claimed closed), and (f) the no-whitespace lexical forms
      # `from"x"` / `import"x"` (the import/from-to-quote separator is
      # `\s*`, so zero whitespace is covered too). All six bypass families
      # had zero instances at wave 4 — the gate rejects them to keep it
      # that way.
      - name: src import surface must be relative or node builtins
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          # One -P pattern: grep -P rejects multiple -e alternatives ("the -P
          # option only supports a single pattern") — the alternation is
          # therefore inline. grep exit 2 (invalid PCRE pattern, unreadable
          # path) must redden the gate: the old `|| true` swallowed any
          # grep failure into a silently-green gate, and the pattern is
          # exactly the part of this gate that future edits can break
          # (rehearsal finding, 2026-08-15; closed W5-6). Exit 1 = zero
          # matches = the green case; exit 0 = matches found, reported
          # below; any other exit = the gate itself failed.
          bad="$(grep -rP --include='*.ts' -Hno "(?<!['\"])(?:from|import)\s*['\"](?!\./|\.\./|node:)[^'\"]+|import\s*\(\s*['\"](?!\./|\.\./|node:)[^'\"]+|import\s*\(\s*[^'\"]|require\s*\(|['\"](?:\.\.?/)+node_modules/|createRequire\s*\(\s*import\.meta\.url\s*\)\s*\(\s*['\"](?!\./|\.\./|node:)[^'\"]+|import\.meta\.resolve\s*\(\s*['\"](?!\./|\.\./|node:)[^'\"]+" src)" && grep_exit=0 || grep_exit=$?
          if [ "$grep_exit" -ne 0 ] && [ "$grep_exit" -ne 1 ]; then
            echo "::error::the import-surface grep itself failed (exit $grep_exit — invalid PCRE pattern or unreadable path): a broken gate must redden CI, not pass green"
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::src imports a bare specifier or a node_modules-resolving path (devDependency leak into the consumer import surface):"
            echo "$bad"
            exit 1
          fi
          echo "src import surface: only relative and node: specifiers (no require/dynamic-import/createRequire/import.meta.resolve/node_modules forms)"

  # Coverage gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): node 26's built-in test coverage
  # (--experimental-test-coverage) measures the files loaded by the suite;
  # node_modules and the matching test files are excluded from the report by
  # default, so the percentage reflects the src/ modules the tests exercise.
  # --test-coverage-lines=60 fails the run (exit 1) when line coverage drops
  # below 60% — the threshold assertion is built into the test runner
  # (initial threshold, tightened as coverage improves). The conformance
  # tests need the provisioned conformance data, so the multi-repo checkout
  # + provision steps of ts-gates are replicated.
  coverage:
    name: coverage (node built-in coverage, lines >= 60%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: ccc99430a6e3003bc1b0830d81cbad245323f0a4 # wave-4 R5 unified provision pin (deliberate snapshot at wave-4 close; the mother-repo HEAD has since advanced to 4ede284 — the pin stays because it carries the provisioned cfd6e296 conformance inventory, fc-manifest sha256 5cb4ab51)
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore. The fc-manifest digest record
          # (docs/fc-manifest-0.13.0.json) is deliberately not copied into the
          # workspace, so no provision-time manifest sha256 assertion is added
          # here (contrast go/py/kt: they copy it and assert sha256 5cb4ab51
          # at the wave-4 R5 unified provision pin ccc9943); ts's
          # aggregate-digest / 18-519 inventory assertions are runtime
          # assertions in runner.ts / runner.test.ts against the provisioned
          # conformance data (W4-13/R10 — documented skip when the manifest
          # is not present).
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # Glob form (node 26 resolves --test arguments as glob patterns) with
      # the coverage switch and the 60% line threshold: the run fails (exit
      # 1) when line coverage of the loaded src/ modules drops below 60%.
      # node --test exits 0 even when the glob matches nothing, and the
      # coverage report then prints a false "all files 100.00" of nothing
      # (measured 2026-08-15) — the 60% threshold cannot catch it, so the
      # find count below only proves *.test.ts files exist on disk and the
      # real zero-match guard is the executed test count parsed from the
      # run's output after it (same guard as the ts-gates job; G36,
      # 2026-08-14).
      - name: node --test with built-in coverage (lines >= 60%)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          files="$(find src -name '*.test.ts' | wc -l)"
          if [[ "$files" -lt 1 ]]; then
            echo "::error::no *.test.ts files matched — the --test glob would run zero tests and exit 0"
            exit 1
          fi
          echo "running $files test files"
          out="$(node --test --experimental-test-coverage --test-coverage-lines=60 "src/**/*.test.ts")" || exit 1
          echo "$out"
          # Executed-count lower bound (G36, hardened 2026-08-15): a --test
          # glob that matches nothing exits 0 with "tests 0" and a false
          # coverage "all files 100.00" of nothing (measured), so the guard
          # reads the actual executed count from the spec-reporter summary
          # (the coverage table rows carry no 'tests N' text; the LAST
          # 'tests N' occurrence is the terminal summary block, anchored
          # like the ts-gates job).
          tests="$(grep -oE 'tests [0-9]+' <<<"$out" | tail -1 | awk '{print $2}')"
          if [ -z "$tests" ]; then
            echo "::error::cannot parse the node --test summary ('tests N' missing from the output)"
            exit 1
          fi
          if [ "$tests" -lt 1 ]; then
            echo "::error::node --test --experimental-test-coverage executed 0 tests although $files *.test.ts files exist on disk — the coverage report would be a false green (100.00 of nothing); the glob 'src/**/*.test.ts' matched nothing"
            exit 1
          fi
          echo "coverage run: $tests tests across $files test files"

  # TS compiler matrix (zod mode): the repo pins typescript ~5.9.0
  # (package.json devDependencies); this job reinstalls the compiler at each
  # matrix version after `npm ci` and re-runs the strict `tsc --noEmit`
  # check, so accidentally relying on newer-only compiler syntax/API fails
  # CI even when the lockfile is untouched. The matrix pins exact versions
  # (a floating 5.8.x/5.9.x range would resolve a different patch on each
  # run and detach the "verified" claim from what actually ran). Versions
  # verified locally: 5.8.3 and 5.9.2 (2026-08-12, @types/node 26.2.0) and
  # 5.9.3 (2026-08-15, wave-4 R26) all compile the tree clean. The lockfile
  # gate below closes the drift hole: every job's npm ci installs the
  # lockfile-resolved compiler (currently 5.9.3), which emits the shipped
  # .d.ts — so the resolved version must be in the verified set, and a
  # future re-resolution must be locally verified before it is accepted.
  # The install rewrites the committed package-lock.json and the
  # package.json devDependencies entry (typescript) — ephemeral drift only,
  # the legs never commit, and the check runs against the installed
  # compiler.
  ts-compiler-matrix:
    name: tsc --noEmit (typescript ${{ matrix.ts }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ts: ['5.8.3', '5.9.2']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # R26 (2026-08-15): the lockfile-resolved typescript version is what
      # every other job compiles and ships with (ts-gates check, prepack
      # build, emitted .d.ts), so it must be inside the verified compiler
      # set — not just the matrix legs.
      - name: lockfile-resolved typescript must be in the verified compiler set
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(node -p "require('./package-lock.json').packages['node_modules/typescript'].version")"
          case "$resolved" in
            5.8.3|5.9.2|5.9.3) ;;
            *)
              echo "::error::lockfile resolves typescript $resolved, outside the verified compiler set (5.8.3 / 5.9.2 / 5.9.3 — R26): the resolved compiler emits the shipped .d.ts, so a new resolution must be locally verified (tsc --noEmit + build) before it is accepted"
              exit 1
              ;;
          esac
          echo "lockfile typescript $resolved is in the verified compiler set (5.8.3 / 5.9.2 / 5.9.3)"
      - name: npm install -D typescript@${{ matrix.ts }} (compiler matrix leg)
        working-directory: typescript
        run: npm install -D "typescript@${{ matrix.ts }}"
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check

  ts-conformance:
    name: ts conformance runner (18 suites / 519 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: ccc99430a6e3003bc1b0830d81cbad245323f0a4 # wave-4 R5 unified provision pin (deliberate snapshot at wave-4 close; the mother-repo HEAD has since advanced to 4ede284 — the pin stays because it carries the provisioned cfd6e296 conformance inventory, fc-manifest sha256 5cb4ab51)
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore. The fc-manifest digest record
          # (docs/fc-manifest-0.13.0.json) is deliberately not copied into the
          # workspace, so no provision-time manifest sha256 assertion is added
          # here (contrast go/py/kt: they copy it and assert sha256 5cb4ab51
          # at the wave-4 R5 unified provision pin ccc9943); ts's
          # aggregate-digest / 18-519 inventory assertions are runtime
          # assertions in runner.ts / runner.test.ts against the provisioned
          # conformance data (W4-13/R10 — documented skip when the manifest
          # is not present).
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # The runner (typescript/src/conformance/runner.ts) computes the
      # aggregate digest
      # (cfd6e296da5b22b62d37b076d35bf6bbf58b0678ceddb37eea51a8b47200ab6a
      # is the spec repo's recorded value) and — when the fc-manifest record
      # is provisioned — verifies it against the recorded digest
      # (fc-manifest-0.13.0.json — 键 aggregate_sha256 / note). The CI
      # provision step deliberately does not copy the manifest (W4-13/R10),
      # so the recorded-digest comparison is a documented skip in CI — the
      # digest value is never compared here; the 18 suites / 519 cases
      # inventory, the per-suite counts and the 519-pass execution (zero
      # failures) are the hard pins, asserted by the runner, runner.test.ts
      # and the CLI smoke below. Glob form: node 26 resolves --test
      # arguments as glob patterns, not directories; a glob that matches
      # nothing exits 0 with "tests 0" (measured 2026-08-15), so the find
      # count below only proves *.test.ts files exist on disk and the real
      # zero-match guard is the executed test count parsed from the run's
      # output (G36, 2026-08-14).
      - name: run the conformance runner (node --test glob)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          files="$(find src/conformance -name '*.test.ts' | wc -l)"
          if [[ "$files" -lt 1 ]]; then
            echo "::error::no *.test.ts files matched — the --test glob would run zero tests and exit 0"
            exit 1
          fi
          echo "running $files test files"
          out="$(node --test "src/conformance/**/*.test.ts")" || exit 1
          echo "$out"
          # Executed-count lower bound (G36, hardened 2026-08-15): same
          # guard as ts-gates — the find count only proves files exist on
          # disk; the executed 'tests N' from the spec-reporter summary is
          # the real zero-match assertion (a glob drift would otherwise pass
          # the find count while node runs zero tests and exits 0).
          tests="$(grep -oE 'tests [0-9]+' <<<"$out" | tail -1 | awk '{print $2}')"
          if [ -z "$tests" ]; then
            echo "::error::cannot parse the node --test summary ('tests N' missing from the output)"
            exit 1
          fi
          if [ "$tests" -lt 1 ]; then
            echo "::error::node --test executed 0 tests although $files *.test.ts files exist under src/conformance — the --test glob 'src/conformance/**/*.test.ts' matched nothing (glob drift must be fixed, not shipped green)"
            exit 1
          fi
          echo "node --test executed $tests tests across $files test files"
      # Runner CLI smoke test (node src/conformance/runner.ts): the CLI
      # entry (main(), typescript/src/conformance/runner.ts) must actually
      # run in CI — 18 suites / 519 cases, exit 0 (RFC 0015 §5.1 success
      # class; verified locally 2026-08-13: 519 passed, digest match). The
      # output assertion makes the smoke real: without it, a broken entry
      # detection exits 0 while main() never runs (G37, 2026-08-14).
      - name: runner CLI smoke (node src/conformance/runner.ts, exit 0)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          # W5-35: the captured output must be printed on failure too — the
          # old form exited before the echo, so a failing CLI left a red job
          # with no diagnostics.
          out="$(node src/conformance/runner.ts)" && cli_exit=0 || cli_exit=$?
          if [ "$cli_exit" -ne 0 ]; then
            echo "::error::the runner CLI failed (exit $cli_exit) — diagnostics above:"
            echo "$out"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "total: 519 passed, 0 skipped, 0 failed" || {
            echo "::error::the runner CLI did not report '519 passed, 0 skipped' — entry detection may have silently skipped main()"
            exit 1
          }

