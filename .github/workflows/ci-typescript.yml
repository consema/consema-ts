# Consema TypeScript CI (docs/five-language-ci-design.md §1.2, §7.1): the
# TypeScript implementation joins the release gate with three explicit jobs
# (the design rejects a single shared matrix, §5.2). ts-gates runs the
# strict tsc check, the full node --test suite and the zero-runtime-
# dependency policy; ts-conformance runs the TS runner over the 18 shared
# suites / 508 cases (the aggregate digest 35bebc8d…, the 18/508 inventory
# and the per-suite counts are pinned inside the runner test,
# typescript/src/conformance/runner.test.ts, §2.2/§4.2); ts-differential
# runs the bidirectional scripts/ts-verify-*.ps1 harnesses against the Rust
# emitters (byte parity + normalized + protocol exchange). The verify
# scripts are Windows PowerShell 5.1 compatible and pass native Windows
# paths to node, so the differential job runs on windows-latest. The
# shared-conformance script (scripts/ts-verify-shared-conformance.ps1,
# §3.6/§7.2) lands with the runner-CLI batch and slots in as a fourth
# differential step. No repository secrets are required.
#
# This repository carries the TypeScript implementation only, so every job
# uses the multi-repo checkout mode: it checks out consema/consema (the spec
# repository, whose conformance/vectors + conformance/differential case sets,
# docs/fc-manifest-0.13.0.json and the toml.corpus.cargo-manifest fixture
# conformance/fixtures/toml/Cargo.toml are the single authority) beside this
# repository and copies the conformance data into the workspace root (the
# runner and the differential harnesses resolve conformance/* by
# repository-relative path). The differential job additionally checks out
# consema/consema-rs (the Rust emitter workspace; the ts-verify-*.ps1
# scripts default to <repo root>\consema-rs) and the scripts build the
# pinned emitter examples (cargo build --locked -p consema-conformance
# --example …) there.
name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ts-gates:
    name: ts gates (fmt/type + unit tests + zero-dep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: consema/consema
          path: consema-repo
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check
      # The full node --test suite via the glob form: node 26 resolves --test
      # positional arguments as glob patterns (a bare directory argument
      # fails), so `npm test` (`node --test src/`) cannot run on the pinned
      # '26.x' toolchain; the glob form matches the package.json
      # test:byte-parity/test:normalized/test:exchange script style and runs
      # the identical suite (unit tests + conformance + capability parity;
      # differential tests report documented skips without their golden env
      # vars).
      - name: node --test (full suite, src/**/*.test.ts)
        working-directory: typescript
        run: node --test "src/**/*.test.ts"
      # Zero-runtime-dependency policy (§1.3): package.json declares only
      # devDependencies, so `npm ls --omit=dev` must show an empty tree.
      - name: zero-dependency assertion (npm ls --omit=dev must be empty)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = npm ls --omit=dev --json 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "npm ls --omit=dev failed (exit $LASTEXITCODE)"
          }
          $tree = $out | ConvertFrom-Json
          $deps = $tree.dependencies
          if ($null -ne $deps -and @($deps.PSObject.Properties).Count -gt 0) {
            throw "runtime dependencies found: $($deps.PSObject.Properties.Name -join ', ')"
          }
          Write-Output 'zero runtime dependencies: npm ls --omit=dev shows none'

  ts-conformance:
    name: ts conformance runner (18 suites / 508 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: consema/consema
          path: consema-repo
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # The runner test (typescript/src/conformance/runner.test.ts) verifies
      # the aggregate digest
      # 35bebc8d384d71740f7c1a886bc50f4e095ff52fe05d2a407f04b842ee6922fa
      # (fc-manifest-0.13.0.json:38), the 18 suites / 508 cases inventory,
      # the per-suite counts, and executes every case (zero failures,
      # documented skips only) — the §4.2 hard pins live in the runner.
      # Glob form: node 26 resolves --test arguments as glob patterns, not
      # directories.
      - name: run the conformance runner (node --test glob)
        working-directory: typescript
        run: node --test "src/conformance/**/*.test.ts"

  ts-differential:
    name: ts differential vs Rust (byte parity + normalized + protocol exchange)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: consema/consema-rs
          path: consema-rs
      - uses: actions/checkout@v4
        with:
          repository: consema/consema
          path: consema-repo
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: consema-rs
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # Each script builds the pinned Rust emitter inside the consema-rs
      # checkout (cargo build --locked -p consema-conformance --example …;
      # the scripts default to <repo root>\consema-rs), provisions the
      # golden/evidence directories, runs the TS side with the golden env
      # vars set, closes the reverse direction, and asserts the tests RAN
      # (not skipped).
      - name: scripts/ts-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/ts-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/ts-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
