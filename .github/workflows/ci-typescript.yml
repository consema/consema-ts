# Consema TypeScript CI (docs/five-language-ci-design.md §1.2, §7.1): the
# TypeScript implementation joins the release gate with three explicit jobs
# (the design rejects a single shared matrix, §5.2). ts-gates runs the
# strict tsc check, the full node --test suite and the zero-runtime-
# dependency policy; ts-compiler-matrix re-runs `tsc --noEmit` under the
# 5.8/5.9 compiler line (zod mode) so newer-only compiler usage fails CI;
# ts-conformance runs the TS runner over the 18 shared
# suites / 508 cases (the aggregate digest 35bebc8d…, the 18/508 inventory
# and the per-suite counts are pinned inside the runner test,
# typescript/src/conformance/runner.test.ts, §2.2/§4.2); ts-differential
# runs the bidirectional scripts/ts-verify-*.ps1 harnesses against the Rust
# emitters (byte parity + normalized + protocol exchange). The verify
# scripts are Windows PowerShell 5.1 compatible and pass native Windows
# paths to node, so the differential job runs on windows-latest. The
# shared-conformance script (scripts/ts-verify-shared-conformance.ps1,
# §3.6/§7.2) lands with the runner-CLI batch and slots in as a fourth
# differential step. The coverage job (node 26 built-in test coverage)
# measures the src/ modules exercised by the suite with a 60% line-coverage
# threshold — initial threshold, tightened as coverage improves. No
# repository secrets are required.
#
# This repository carries the TypeScript implementation only, so every job
# uses the multi-repo checkout mode: it checks out consema/consema (the spec
# repository, whose conformance/vectors + conformance/differential case sets,
# docs/fc-manifest-0.13.0.json and the toml.corpus.cargo-manifest fixture
# conformance/fixtures/toml/Cargo.toml are the single authority) beside this
# repository and copies the conformance data into the workspace root (the
# runner and the differential harnesses resolve conformance/* by
# repository-relative path). The differential job additionally checks out
# consema/consema-rs (the Rust emitter workspace; the ts-verify-*.ps1
# scripts default to <repo root>\consema-rs) and the scripts build the
# pinned emitter examples (cargo build --locked -p consema-conformance
# --example …) there.
name: TypeScript CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ts-ci-${{ github.ref }}
  cancel-in-progress: true

# Top-tier P0: minimal token scope. Every job here only reads repository
# contents (checkout + multi-repo checkouts + running repo scripts); none
# uploads artifacts or writes check runs, so the global minimum suffices
# (cache restore works with contents: read; cache save denial is a warning
# only, per the actions/cache contract).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ts-gates:
    name: ts gates (fmt/type + unit tests + zero-dep)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check
      # The full node --test suite via the glob form: node 26 resolves --test
      # positional arguments as glob patterns (a bare directory argument
      # fails), so `npm test` (`node --test src/`) cannot run on the pinned
      # '26.x' toolchain; the glob form matches the package.json
      # test:byte-parity/test:normalized/test:exchange script style and runs
      # the identical suite (unit tests + conformance + capability parity;
      # differential tests report documented skips without their golden env
      # vars).
      - name: node --test (full suite, src/**/*.test.ts)
        working-directory: typescript
        run: node --test "src/**/*.test.ts"
      # Zero-runtime-dependency policy (§1.3): package.json declares only
      # devDependencies, so `npm ls --omit=dev` must show an empty tree.
      - name: zero-dependency assertion (npm ls --omit=dev must be empty)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = npm ls --omit=dev --json 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "npm ls --omit=dev failed (exit $LASTEXITCODE)"
          }
          $tree = $out | ConvertFrom-Json
          $deps = $tree.dependencies
          if ($null -ne $deps -and @($deps.PSObject.Properties).Count -gt 0) {
            throw "runtime dependencies found: $($deps.PSObject.Properties.Name -join ', ')"
          }
          Write-Output 'zero runtime dependencies: npm ls --omit=dev shows none'

  # Coverage gate (gate plan §4 M3 standing toolchain; roadmap §18.3
  # "Coverage 不替代语义证明"): node 26's built-in test coverage
  # (--experimental-test-coverage) measures the files loaded by the suite;
  # node_modules and the matching test files are excluded from the report by
  # default, so the percentage reflects the src/ modules the tests exercise.
  # --test-coverage-lines=60 fails the run (exit 1) when line coverage drops
  # below 60% — the threshold assertion is built into the test runner
  # (initial threshold, tightened as coverage improves). The conformance
  # tests need the provisioned conformance data, so the multi-repo checkout
  # + provision steps of ts-gates are replicated.
  coverage:
    name: coverage (node built-in coverage, lines >= 60%)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # Glob form (node 26 resolves --test arguments as glob patterns) with
      # the coverage switch and the 60% line threshold: the run fails (exit
      # 1) when line coverage of the loaded src/ modules drops below 60%.
      - name: node --test with built-in coverage (lines >= 60%)
        working-directory: typescript
        run: node --test --experimental-test-coverage --test-coverage-lines=60 "src/**/*.test.ts"

  # TS compiler matrix (zod mode): the repo pins typescript ~5.9.0
  # (package.json devDependencies); this job reinstalls the compiler at each
  # matrix version after `npm ci` and re-runs the strict `tsc --noEmit`
  # check, so accidentally relying on newer-only compiler syntax/API fails
  # CI even when the lockfile is untouched. Versions verified locally
  # (2026-08-12): 5.8.x and 5.9.x both compile the tree clean with
  # @types/node 26.2.0. npm 7+ resolves a trailing `.x` range, and the
  # install writes only the gitignored node_modules + lockfile, so the
  # checkout stays pristine between legs.
  ts-compiler-matrix:
    name: tsc --noEmit (typescript ${{ matrix.ts }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ts: ['5.8.x', '5.9.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm install -D typescript@${{ matrix.ts }} (compiler matrix leg)
        working-directory: typescript
        run: npm install -D "typescript@${{ matrix.ts }}"
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check

  ts-conformance:
    name: ts conformance runner (18 suites / 508 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # The runner test (typescript/src/conformance/runner.test.ts) verifies
      # the aggregate digest
      # 35bebc8d384d71740f7c1a886bc50f4e095ff52fe05d2a407f04b842ee6922fa
      # (fc-manifest-0.13.0.json:38), the 18 suites / 508 cases inventory,
      # the per-suite counts, and executes every case (zero failures,
      # documented skips only) — the §4.2 hard pins live in the runner.
      # Glob form: node 26 resolves --test arguments as glob patterns, not
      # directories.
      - name: run the conformance runner (node --test glob)
        working-directory: typescript
        run: node --test "src/conformance/**/*.test.ts"

  ts-differential:
    name: ts differential vs Rust (byte parity + normalized + protocol exchange)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema-rs
          path: consema-rs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          path: consema-repo
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: consema-rs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'docs') | Out-Null
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\docs\fc-manifest-0.13.0.json'
          if (-not (Test-Path -LiteralPath $manifest)) {
            throw "fc-manifest not found in the consema checkout: $manifest"
          }
          Copy-Item -LiteralPath $manifest -Destination (Join-Path $env:GITHUB_WORKSPACE 'docs\fc-manifest-0.13.0.json') -Force
          # The toml.corpus.cargo-manifest case reads the committed fixture
          # conformance/fixtures/toml/Cargo.toml (single authority), which is
          # included in the conformance/ copy above; no workspace-root
          # Cargo.toml is provisioned anymore.
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files + docs/fc-manifest-0.13.0.json"
      # Each script builds the pinned Rust emitter inside the consema-rs
      # checkout (cargo build --locked -p consema-conformance --example …;
      # the scripts default to <repo root>\consema-rs), provisions the
      # golden/evidence directories, runs the TS side with the golden env
      # vars set, closes the reverse direction, and asserts the tests RAN
      # (not skipped).
      - name: scripts/ts-verify-byte-parity.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-byte-parity.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/ts-verify-normalized-differential.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-normalized-differential.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: scripts/ts-verify-protocol-exchange.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/ts-verify-protocol-exchange.ps1'
          & $script
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Version-consistency gate (tokio check-readme pattern): the README
  # "Version:" line must equal the typescript/package.json version, so a
  # version bump that forgets the README fails CI.
  check-version-consistency:
    name: check README version vs package.json (version consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: assert package.json version == README Version line
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' typescript/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in typescript/package.json"
            exit 1
          fi
          grep -qF "Version: $version" README.md || {
            echo "::error::README.md does not declare 'Version: $version'"
            exit 1
          }
          echo "README version consistent with package.json: $version"

  # SDK examples gate: typescript/examples/sdk_chain.ts is the committed
  # five-language SDK chain example (parse -> native query -> best-exact
  # projection -> semantic edit -> canonical materialization -> TOML
  # conversion; language-neutral contract reference: consema repository
  # docs/cookbook.md). node 26 runs .ts files natively, and the example must
  # exit 0. The example is a pure SDK chain (no conformance data), so no
  # multi-repo checkout or provision step is needed.
  examples:
    name: examples (node examples/sdk_chain.ts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: node examples/sdk_chain.ts (must exit 0)
        working-directory: typescript
        run: node examples/sdk_chain.ts

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [ts-gates, ts-conformance, ts-differential, ts-compiler-matrix, coverage, check-version-consistency, examples]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
