  # Dependency audit (npm audit), the standing security gate in the
  # aggregate check (rs ci.yml shape; G135, 2026-08-13). Identical to the
  # audit.yml npm-audit job — the daily cron lives in the separate audit.yml
  # workflow because the aggregate check's needs must name jobs within the
  # same workflow (G99, 2026-08-14). The package declares ZERO runtime
  # dependencies
  # (package.json has only devDependencies — @types/node, typescript — per
  # the §1.3 zero-runtime-dependency policy, asserted in ts-gates), so `npm
  # audit` in full (no --omit=dev) covers the complete dependency surface:
  # the devDependencies and their transitive tree are the whole graph. The
  # job is unconditional (no `if:`) so it can never be skipped — a skipped
  # job in the aggregate would fail the alls-green gate (unconditional jobs
  # need no skip allowance).
  npm-audit:
    name: npm audit (npm advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm audit (full — devDependencies are the entire dependency surface)
        working-directory: typescript
        run: npm audit

  # Version-consistency gate (tokio check-readme pattern): the
  # typescript/package.json version must ride the train in every hard-coded
  # pin — (1) the README "Version:" line, (2) the bug_report.yml template's
  # "当前 <version>" note, (3) the CLI-record fixture's dynamic read: the
  # product_version fixtures in typescript/src/protocol/cli.test.ts derive
  # from typescript/package.json at runtime (single authority, R36,
  # 2026-08-15 — wave-4 T1c 4b15fa3 replaced the former literal pins) and
  # the fixture must never spell the current version. A bump that forgets
  # any of them fails CI. The job name below reflects the full coverage
  # (R26, 2026-08-15).
  check-version-consistency:
    name: check version consistency (README + bug_report template + CLI fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: assert package.json version == README Version line
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' typescript/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in typescript/package.json"
            exit 1
          fi
          # Exact comparison of the version token, not a substring match:
          # "1.0.0" is a substring of "1.0.0-rc.1（…）", so a rc-to-GA bump
          # that forgets the README must not pass. The README line is
          # "Version: <version>（…）", so the token is everything up to the
          # full-width parenthesis.
          readme_version=$(grep -m1 '^Version: ' README.md | sed -E 's/^Version: ([^（]+).*/\1/')
          if [[ "$readme_version" != "$version" ]]; then
            echo "::error::README.md Version line ($readme_version) != package.json version ($version)"
            exit 1
          fi
          # The bug_report.yml template hard-codes the current version; an
          # rc-to-GA bump that forgets the template must fail CI too.
          grep -qF "version（当前 $version）" .github/ISSUE_TEMPLATE/bug_report.yml || {
            echo "::error::.github/ISSUE_TEMPLATE/bug_report.yml does not declare the current version"
            exit 1
          }
          echo "README version consistent with package.json: $version"
      # CLI fixture version derivation (R36, 2026-08-15; wave-4 T1c
      # 4b15fa3): the CLI-record tests derive the envelope product_version
      # from typescript/package.json at runtime (PACKAGE_VERSION in
      # typescript/src/protocol/cli.test.ts reads the manifest next to the
      # package) instead of pinning literals, so a train bump cannot drift
      # unnoticed in the fixture — the fixture and the package manifest are
      # one authority. This step pins that dynamic form: the fixture must
      # carry the package.json derivation, the version extraction and the
      # PACKAGE_VERSION use, AND zero occurrences of the current version
      # string (code or comment — the fixture never spells the version). A
      # regression to hardcoded literals reddens the gate; the fixture
      # itself is not changed by this gate.
      - name: assert the CLI fixture derives the version from package.json (no literal, R36)
        shell: bash
        run: |
          set -euo pipefail
          fixture=typescript/src/protocol/cli.test.ts
          version=$(grep -m1 '"version"' typescript/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in typescript/package.json"
            exit 1
          fi
          grep -qF "'../../package.json'" "$fixture" || {
            echo "::error::$fixture no longer reads the version from package.json (expected the '../../package.json' derivation, R36 dynamic form)"
            exit 1
          }
          grep -qF "as { version: string }" "$fixture" || {
            echo "::error::$fixture no longer extracts the package version (expected the 'as { version: string }' cast, R36 dynamic form)"
            exit 1
          }
          grep -qF "PACKAGE_VERSION" "$fixture" || {
            echo "::error::$fixture no longer references PACKAGE_VERSION in the envelope fixtures (R36 dynamic form)"
            exit 1
          }
          if grep -qF "$version" "$fixture"; then
            echo "::error::$fixture hardcodes the current version '$version' — the fixture must derive it from package.json (single authority, R36); remove the literal"
            exit 1
          fi
          echo "cli.test.ts derives the envelope version from package.json: $version (zero literal occurrences)"

  # SDK examples gate: typescript/examples/sdk_chain.ts is the committed
  # five-language SDK chain example (parse -> native query -> best-exact
  # projection -> semantic edit -> canonical materialization -> TOML
  # conversion; language-neutral contract reference: consema repository
  # https://github.com/consema/consema/blob/main/docs/cookbook.md), and
  # typescript/quickstart.ts is the committed copy of the root README
  # quick-start fence (R6, 2026-08-15 — the kt-style fence gate below makes
  # the "粘贴版与入库版一致" claim enforced, not asserted). node 26 runs
  # .ts files natively, and each example must exit 0 with its output
  # asserted (the sdk_chain run must reach the final conversion step — an
  # early silent return would exit 0 while the chain never runs, G37
  # lesson). The examples are pure SDK chains (no conformance data), so no
  # multi-repo checkout or provision step is needed.
  examples:
    name: examples (fence + sdk_chain + quickstart)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # Knit-style doc-example gate (R6, 2026-08-15; mirrors the
      # consema-kt ci-kotlin.yml fence step): the README ```ts quick-start
      # fence must equal the committed typescript/quickstart.ts body (both
      # sides normalized for CRLF and trimmed), so the README snippet can
      # never drift from what CI actually runs.
      - name: README quick-start fence must match typescript/quickstart.ts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $readme = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Raw
          $file = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'typescript/quickstart.ts') -Raw
          $body = ($file -replace "`r", '').Trim()
          # Content-anchored comparison (W5-2/5, 2026-08-15; mirrors the kt
          # ci-kotlin.yml fence gate): the first-```ts match was position-
          # fragile — a new ```ts block before the quick-start section
          # would silently become the compared fence (pseudo-pass if
          # identical, false red otherwise). Compare EVERY fence by content
          # and require exactly one match, so the fence is located by its
          # content, not its position.
          $matches = @()
          foreach ($m in [regex]::Matches($readme, '(?s)```ts\r?\n(.*?)\r?\n```')) {
            $fence = ($m.Groups[1].Value -replace "`r", '').Trim()
            if ($fence -eq $body) {
              $matches += $fence
            }
          }
          if ($matches.Count -ne 1) {
            throw "README.md must contain exactly one ```ts fence equal to typescript/quickstart.ts (located by content; CRLF-normalized and trimmed) — found $($matches.Count) matching fence(s)"
          }
          Write-Output 'README quick-start fence matches typescript/quickstart.ts (located by content)'
      # Output assertion (R47, 2026-08-15): the sdk_chain example must
      # actually reach the final conversion step — a broken early return
      # exits 0 while the chain never runs, so the exit code alone is not
      # evidence (G37 lesson, same as the runner CLI smoke step).
      - name: node examples/sdk_chain.ts (must exit 0, output asserted)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          # W5-35: print the captured output on failure too (the old form
          # exited before the echo, swallowing the example's diagnostics).
          out="$(node examples/sdk_chain.ts)" && example_exit=0 || example_exit=$?
          if [ "$example_exit" -ne 0 ]; then
            echo "::error::sdk_chain.ts failed (exit $example_exit) — diagnostics above:"
            echo "$out"
            exit 1
          fi
          echo "$out"
          echo "$out" | grep -q "convert to toml.canonical-document:" || {
            echo "::error::sdk_chain.ts did not reach the final TOML conversion step — a silent early return would exit 0 while the chain never runs"
            exit 1
          }
      - name: node quickstart.ts (committed quick-start, must exit 0)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          # W5-35: print the captured output on failure too.
          out="$(node quickstart.ts)" && qs_exit=0 || qs_exit=$?
          if [ "$qs_exit" -ne 0 ]; then
            echo "::error::quickstart.ts failed (exit $qs_exit) — diagnostics above:"
            echo "$out"
            exit 1
          fi
          echo "$out"
          # The quick start must render the edited document (final step of
          # the parse -> query -> edit -> render chain).
          echo "$out" | grep -q '{"a":1,"b":{"c":42}}' || {
            echo "::error::quickstart.ts did not print the edited render — a silent early return would exit 0 while the chain never runs"
            exit 1
          }

  # L5 packaging gate (five-language-ci-design.md §1.1 package row / §5.3
  # L5 row): `npm pack` must succeed (prepack builds dist/) and the tarball
  # must contain the published dist/ entry points, the LICENSE text, and
  # no *.test.ts compiled artifacts nor test_helpers/test_decode (the gate
  # asserts exactly that manifest, W3-40/R4); dev harness modules
  # (conformance runner, differential, capability_parity) ship with the
  # package but are not reachable through the exports map (known state,
  # recorded 2026-08-14, W3-40/R4). Then a clean-directory install must
  # import the package root (G33/G35/G95, 2026-08-14). Nothing is
  # published here, no repository secrets are used, and no conformance
  # data is needed (packaging is data-independent).
  ts-package:
    name: "ts package (npm pack, files: dist + LICENSE)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      - name: npm pack + tarball shape assertion (dist, LICENSE, no *.test.ts/test_helpers/test_decode)
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errFile = Join-Path $env:RUNNER_TEMP 'npm-pack-stderr.txt'
          $out = & npm pack --json 2>$errFile
          if ($LASTEXITCODE -ne 0) {
            $err = if (Test-Path -LiteralPath $errFile) { Get-Content -LiteralPath $errFile -Raw } else { '' }
            throw "npm pack failed (exit $LASTEXITCODE):`n$err"
          }
          Remove-Item -LiteralPath $errFile -ErrorAction SilentlyContinue
          $pack = @($out | ConvertFrom-Json)[0]
          $files = @($pack.files | ForEach-Object { $_.path })
          if (-not ($files -contains 'dist/index.js') -or -not ($files -contains 'dist/index.d.ts')) {
            throw 'npm pack tarball must contain dist/index.js + dist/index.d.ts (the published entry points, G33)'
          }
          if (-not ($files -contains 'LICENSE')) {
            throw 'npm pack tarball must contain the LICENSE text (G95)'
          }
          $testOnly = @($files | Where-Object { $_ -match '(\.test\.|test_helpers|test_decode)' })
          if ($testOnly.Count -gt 0) {
            throw "npm pack tarball must not contain test-only files: $($testOnly -join ', ')"
          }
          # W5-33 (2026-08-15): the R43 .d.ts specifier rewrite
          # (tools_rewrite_dts.mjs turns relative `./x.ts` specifiers into
          # `./x.js` in the emitted .d.ts) had zero CI assertions on its
          # OUTPUT — if the rewrite silently vanished from the build chain
          # or tsc re-emitted .ts specifiers, the tarball would carry d.ts
          # files pointing at files that do not exist in the package. The
          # tarball itself is the inspected surface: every dist/**/*.d.ts
          # must be free of relative specifiers ending in .ts (the same
          # contract the rewrite enforces).
          $dtsFiles = @($pack.files | Where-Object { $_.path -match '^dist/.*\.d\.ts$' })
          $badSpecifiers = @()
          foreach ($entry in $dtsFiles) {
            $content = Get-Content -LiteralPath (Join-Path (Get-Location) $entry.path) -Raw
            foreach ($m in [regex]::Matches($content, "['""](\.\.?/[^'""]+)\.ts['""]")) {
              $badSpecifiers += "$($entry.path): $($m.Value)"
            }
          }
          if ($badSpecifiers.Count -gt 0) {
            throw "dist .d.ts files contain relative .ts specifiers (the R43 rewrite did not run or tsc re-emitted them):`n$($badSpecifiers -join "`n")"
          }
          Write-Output "npm pack ok: $($pack.files.Count) files, dist entry points + LICENSE present, no *.test.ts / test_helpers / test_decode files, zero relative .ts specifiers in dist .d.ts"
      # Clean-directory install + package-root import smoke (G33,
      # 2026-08-14): the tarball must be importable from the package root by
      # a consumer — the source-direct shape failed this check under node 26
      # (type stripping refuses node_modules), this step keeps the dist
      # shape honest in CI.
      - name: clean-install package-root import smoke
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP ('consema-ts-install-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force (Join-Path $tmp 'app') | Out-Null
          $packed = npm pack --pack-destination $tmp --json
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $pkg = @($packed | ConvertFrom-Json)[0]
          $tgz = Join-Path $tmp $pkg.filename
          Push-Location (Join-Path $tmp 'app')
          try {
            npm init -y | Out-Null
            npm install $tgz | Out-Null
            node --input-type=module -e "import { parseDocument, profiles, formatFamilies } from '@consema/consema'; const pid = profiles().find(p => p.profile().id() === 'json.strict')?.profile(); if (!pid) throw new Error('no json.strict profile'); const d = parseDocument(new TextEncoder().encode('{`"a`":1}'), pid); if (typeof d.asJson() === 'string') throw new Error('not json'); if (formatFamilies().length !== 8) throw new Error('bad families'); console.log('package root import OK')"
            if ($LASTEXITCODE -ne 0) { throw 'package root import failed' }
          }
          finally {
            Pop-Location
            Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }

  # Alls-green aggregate gate (tokio/pydantic pattern): `check (all gates
  # green)` is the SINGLE required check for branch protection on this
  # repository; every other job stays non-required. `if: always()` is
  # mandatory — otherwise GitHub skips this job when a dependency fails and
  # a skipped check can be treated as success. `jobs: ${{ toJSON(needs) }}`
  # is the action's mandatory input (it does not read the needs context
  # automatically). No job here uses continue-on-error, so the
  # allowed-failures list is empty.
  check:
    name: check (all gates green)
    if: always()
    needs: [ts-gates, ts-conformance, ts-differential, ts-compiler-matrix, coverage, npm-audit, check-version-consistency, examples, ts-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-failures: ''
          jobs: ${{ toJSON(needs) }}
