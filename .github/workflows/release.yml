# Consema TypeScript release: tag-triggered npm publish of @consema/consema
# (top-tier bar: 半自动发布, pydantic precedent; zod canary publishing is
# a later P2 option, see RELEASING.md §3).
#
# Publishing shape (decision, G33, 2026-08-14 — 1.0 前发布编译产物): the
# package ships compiled JS + d.ts from typescript/dist/ (package.json
# files = ["dist", "LICENSE"], main/types/exports point at dist/; prepack
# runs `tsc -p tsconfig.build.json` and copies the LICENSE text into the
# package directory) — node 26 type stripping refuses files under
# node_modules, so a source-direct package is not importable in the
# declared support window (engines >= 26); the clean-install import smoke
# below verifies the packaged shape right before publishing.
#
# npm test runs the conformance runner, which reads conformance/* by
# repository-relative path (typescript/src/conformance/runner.ts); without
# the data the runner fails with ENOENT. Like the CI workflows, this job
# checks out consema/consema (the spec repository, single authority) beside
# this repo and copies the conformance data into the workspace root before
# testing (multi-repo checkout + provision pattern, ci-typescript.yml).
#
# Credentials: npm access token via the NPM_TOKEN repository secret
# (Settings → Secrets and variables → Actions), exposed to npm through
# setup-node's registry-url + NODE_AUTH_TOKEN. Provenance (npm 9.5+,
# Sigstore) is enabled via `npm publish --provenance`: it requires
# id-token: write (declared below) and a public npm registry; the
# publishConfig.provenance flag in package.json keeps it on for manual
# publishes too. User-side setup steps: see RELEASING.md §2.
name: Release to npm

on:
  push:
    tags: ['v*']

# G122 (2026-08-14): a re-pushed/retried tag while the previous run is still
# in flight would trigger a concurrent publish (npm 409s, double verify) —
# one run per tag ref, the newer run cancels the older one (rs precedent).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm ci + test + publish (provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: consema/consema
          ref: ccc99430a6e3003bc1b0830d81cbad245323f0a4 # wave-4 R5 unified provision pin (deliberate snapshot at wave-4 close; the mother-repo HEAD has since advanced to 4ede284 — the pin stays because it carries the provisioned cfd6e296 conformance inventory, fc-manifest sha256 5cb4ab51)
          path: consema-repo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.7.0'
          registry-url: 'https://registry.npmjs.org'
          # No npm cache in this workflow (G34, 2026-08-14): the setup-node
          # cache input only accepts package-manager names (npm/yarn/pnpm/
          # bun) — a boolean is rejected ("Caching for 'false' is not
          # supported"), so caching is simply left off: this tag-triggered
          # publishing workflow never consumes a (potentially poisoned)
          # cache entry (zizmor cache-poisoning); the CI workflows keep the
          # cache.
      # provision conformance data from the consema spec repository
      # (the runner test resolves conformance/* by repository-relative path;
      # identical step to the ts-gates job of ci-typescript.yml).
      # The fc-manifest digest record (docs/fc-manifest-0.13.0.json in the
      # spec repo) is deliberately NOT copied (W4-13/R10), so the runner's
      # aggregate-digest / 18-519 inventory-vs-manifest assertions are a
      # documented skip on the release path too — the 519-case execution
      # itself runs for real (W5-9, 2026-08-15).
      - name: provision conformance data from the consema spec repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'consema-repo\conformance'
          $target = Join-Path $env:GITHUB_WORKSPACE 'conformance'
          if (-not (Test-Path -LiteralPath $source)) {
            throw "conformance data not found in the consema checkout: $source"
          }
          if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
          Copy-Item -LiteralPath $source -Destination $target -Recurse -Force
          $count = @(Get-ChildItem -LiteralPath $target -Recurse -File).Count
          Write-Output "provisioned conformance/: $count files"

      # Release guard (G71, 2026-08-14; R7 peel fix, 2026-08-15; same gate
      # shape as the consema-go/consema-rs/consema-py release.yml verify
      # steps): the tag must point at a commit on origin/main — a tag pushed
      # from a stale or divergent commit must not publish old code. The
      # workflow runs after the push, when origin/main may already have
      # advanced past the tag's commit, so a realtime HEAD comparison would
      # fail a legitimately pushed tag; ancestry is used instead
      # (git merge-base --is-ancestor, W3-28: the tag's commit is fixed at
      # push time via $GITHUB_SHA). R7: for an annotated-tag push,
      # GITHUB_SHA is the tag OBJECT sha, not the peeled commit — whether a
      # given git then accepts it (recent gits peel internally; older ones
      # fail with 'fatal: not a commit') is version-dependent, so the
      # explicit ^{commit} peel makes the guard correct on every git
      # version and for both tag forms (locally preplayed 2026-08-15:
      # lightweight/annotated x tip/ancestor/off-main all decide
      # correctly).
      - name: verify tag points at a commit on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          tag_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" FETCH_HEAD; then
            echo "::error::tag $GITHUB_REF_NAME does not point at a commit on origin/main"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME points at a commit on origin/main ($tag_commit)"
      # Release guard (rc 前六角色审计 P1, 2026-08-12): the tag minus the
      # leading v must equal the package.json version, otherwise a mismatched
      # tag could publish the wrong version to npm.
      - name: verify tag matches manifest version (package.json)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $manifest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json version $manifest"
      # Release-path version-consistency + import-surface re-run (W5-14,
      # 2026-08-15; twin of the ci-typescript.yml check-version-consistency
      # job and the ts-gates G96 step — keep the two in sync): the tag
      # trigger does not run the main-branch CI jobs, and the G71 ancestor
      # guard allows tagging any ancestor commit, so a partially-bumped
      # commit (package.json bumped, README / bug_report template not) or
      # a devDependency-leaking import could otherwise publish with those
      # surfaces stale.
      - name: verify version consistency (README Version line + bug_report template + CLI fixture dynamic form + G96 import surface)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::no 'version' found in package.json"
            exit 1
          fi
          readme_version=$(grep -m1 '^Version: ' ../README.md | sed -E 's/^Version: ([^（]+).*/\1/')
          if [[ "$readme_version" != "$version" ]]; then
            echo "::error::README.md Version line ($readme_version) != package.json version ($version)"
            exit 1
          fi
          grep -qF "version（当前 $version）" ../.github/ISSUE_TEMPLATE/bug_report.yml || {
            echo "::error::.github/ISSUE_TEMPLATE/bug_report.yml does not declare the current version"
            exit 1
          }
          fixture=src/protocol/cli.test.ts
          grep -qF "'../../package.json'" "$fixture" || {
            echo "::error::$fixture lost the package.json version derivation (R36 dynamic form — the fixture must never spell the current version)"
            exit 1
          }
          if grep -qF "$version" "$fixture"; then
            echo "::error::$fixture hardcodes the current version '$version' (R36 dynamic form requires derivation from package.json)"
            exit 1
          fi
          bad="$(grep -rP --include='*.ts' -Hno "(?<!['\"])(?:from|import)\s*['\"](?!\./|\.\./|node:)[^'\"]+|import\s*\(\s*['\"](?!\./|\.\./|node:)[^'\"]+|import\s*\(\s*[^'\"]|require\s*\(|['\"](?:\.\.?/)+node_modules/|createRequire\s*\(\s*import\.meta\.url\s*\)\s*\(\s*['\"](?!\./|\.\./|node:)[^'\"]+|import\.meta\.resolve\s*\(\s*['\"](?!\./|\.\./|node:)[^'\"]+" src)" && grep_exit=0 || grep_exit=$?
          if [ "$grep_exit" -ne 0 ] && [ "$grep_exit" -ne 1 ]; then
            echo "::error::the import-surface grep failed (exit $grep_exit)"
            exit 1
          fi
          if [ -n "$bad" ]; then
            echo "::error::src imports a bare specifier or a node_modules-resolving path (devDependency leak into the consumer import surface):"
            echo "$bad"
            exit 1
          fi
          echo "version surfaces consistent + import surface clean: $version"
      - name: npm ci (lockfile-driven install)
        working-directory: typescript
        run: npm ci
      # Zero-dependency assertion on the release path (R45, 2026-08-15):
      # the zero-runtime-dependency gate in ci-typescript.yml runs only on
      # main-branch push / PR (its `on:` has no tag trigger), and the G71
      # guard allows any ancestor commit of main to be tagged — so the
      # release path must assert the empty dependency tree itself, right
      # before publishing (same step shape as the ts-gates job).
      - name: zero-dependency assertion (npm ls --omit=dev must be empty)
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = npm ls --omit=dev --json 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw "npm ls --omit=dev failed (exit $LASTEXITCODE)"
          }
          $tree = $out | ConvertFrom-Json
          $deps = $tree.dependencies
          if ($null -ne $deps -and @($deps.PSObject.Properties).Count -gt 0) {
            throw "runtime dependencies found: $($deps.PSObject.Properties.Name -join ', ')"
          }
          Write-Output 'zero runtime dependencies: npm ls --omit=dev shows none'
      - name: npm run check (tsc --noEmit, strict)
        working-directory: typescript
        run: npm run check
      - name: npm test (node --test, full suite)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          # npm test's quoted glob exits 0 even when nothing matched ("tests
          # 0"); a zero-test run must not pass the release gate.
          files="$(find src -name '*.test.ts' | wc -l)"
          if [[ "$files" -lt 1 ]]; then
            echo "::error::no *.test.ts files matched — npm test would run zero tests and exit 0"
            exit 1
          fi
          echo "running $files test files"
          # W5-35: print the captured output on failure too (a failing
          # release-path test run must not be a red job with zero
          # diagnostics).
          out="$(npm test 2>&1)" && test_exit=0 || test_exit=$?
          if [ "$test_exit" -ne 0 ]; then
            echo "::error::npm test failed (exit $test_exit) — diagnostics above:"
            echo "$out"
            exit 1
          fi
          echo "$out"
          # G72 disclosure + skip-inventory assertion (W5-1/7, 2026-08-15):
          # on the release path the documented skips are exactly 9 — the
          # five differential tests (byte parity 1 + normalized 2 +
          # protocol exchange 2) without their CONSEMA_* golden env vars,
          # plus the four capability-parity tests without the provisioned
          # fc-manifest. The old disclosure counted "three differential
          # tests" and omitted the parity tests entirely, and the release
          # path had no skip-count gate at all (unlike the ci-typescript.yml
          # ts-gates job, R47/W5-21). The differential gate is covered by
          # the CI ts-differential job.
          skipped="$(grep -oE 'skipped [0-9]+' <<<"$out" | tail -1 | awk '{print $2}')"
          if [ -z "$skipped" ]; then
            echo "::error::cannot parse the node --test skip summary ('skipped N' missing from the output)"
            exit 1
          fi
          if [ "$skipped" -ne 9 ]; then
            echo "::error::$skipped tests skipped on the release path (expected exactly 9 = 5 differential without their golden env vars + 4 capability parity without the provisioned fc-manifest); a skip inventory drift must be reviewed, not shipped"
            exit 1
          fi
          echo "release-path npm test: $skipped documented skips (5 differential + 4 capability parity, exact); CI ts-differential covers the differential legs"
      - name: npm publish --dry-run (packaging validation before the real publish)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$version" == *-* ]]; then
            npm publish --dry-run --access public --tag rc
          else
            npm publish --dry-run --access public
          fi
      # Clean-install package-root import smoke (G33, 2026-08-14): verify
      # the tarball is importable from a fresh consumer install right before
      # publishing (same step as the CI ts-package job).
      - name: clean-install package-root import smoke
        working-directory: typescript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The tarball is packed into a persistent directory and its path
          # recorded for the publish step: W5-27 publishes THIS exact
          # tarball (npm publish <tarball> does not rebuild), so the tested
          # bytes are the published bytes — previously the publish step
          # re-ran prepack and shipped a third, never-tested build.
          $tarballDir = Join-Path $env:RUNNER_TEMP 'consema-ts-publish'
          New-Item -ItemType Directory -Force $tarballDir | Out-Null
          $packed = npm pack --pack-destination $tarballDir --json
          if ($LASTEXITCODE -ne 0) { throw 'npm pack failed' }
          $pkg = @($packed | ConvertFrom-Json)[0]
          $tgz = Join-Path $tarballDir $pkg.filename
          Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'consema-ts-publish-tgz-path.txt') -Value $tgz
          $tmp = Join-Path $env:RUNNER_TEMP ('consema-ts-install-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force (Join-Path $tmp 'app') | Out-Null
          Push-Location (Join-Path $tmp 'app')
          try {
            npm init -y | Out-Null
            npm install $tgz | Out-Null
            node --input-type=module -e "import { parseDocument, profiles, formatFamilies } from '@consema/consema'; const pid = profiles().find(p => p.profile().id() === 'json.strict')?.profile(); if (!pid) throw new Error('no json.strict profile'); const d = parseDocument(new TextEncoder().encode('{`"a`":1}'), pid); if (typeof d.asJson() === 'string') throw new Error('not json'); if (formatFamilies().length !== 8) throw new Error('bad families'); console.log('package root import OK')"
            if ($LASTEXITCODE -ne 0) { throw 'package root import failed' }
          }
          finally {
            Pop-Location
            Remove-Item -LiteralPath $tmp -Recurse -Force -ErrorAction SilentlyContinue
          }
      # Dist-tag branch (W3-43, 2026-08-14; RELEASING.md §1 step 4): npm 11
      # requires an explicit dist-tag for prerelease versions (publish
      # without --tag fails) — a version with a prerelease suffix (e.g.
      # 1.0.0-rc.1) publishes to the rc dist-tag (`@consema/consema@rc`);
      # a GA version (no `-` segment, e.g. 1.0.0) omits --tag and npm
      # assigns `latest` (wave-2 discovery 2026-08-14, both branches
      # preplayed locally with npm publish --dry-run, W3-43).
      - name: npm publish (provenance, public access; prerelease -> rc dist-tag, GA -> latest)
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          # W5-27 (2026-08-15): publish the exact tarball the clean-install
          # smoke tested — `npm publish <tarball>` publishes the file as-is
          # without re-running prepack, so the tested bytes are the
          # published bytes (previously the publish step re-built dist and
          # shipped a third, never-tested build).
          tgz_path_file="$RUNNER_TEMP/consema-ts-publish-tgz-path.txt"
          if [ ! -f "$tgz_path_file" ]; then
            echo "::error::the smoke step's tarball path record is missing ($tgz_path_file) — the clean-install smoke must run before publish"
            exit 1
          fi
          tgz="$(cat "$tgz_path_file")"
          if [ ! -f "$tgz" ]; then
            echo "::error::the smoke-tested tarball is missing: $tgz"
            exit 1
          fi
          if [[ "$version" == *-* ]]; then
            npm publish "$tgz" --provenance --access public --tag rc
          else
            npm publish "$tgz" --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
